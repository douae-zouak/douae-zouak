<svg xmlns="http://www.w3.org/2000/svg" width="450" height="180" viewBox="0 0 450 180" fill="none">
  <style>
    .card {
      width: 448px;
      height: 178px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-sizing: border-box;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .title-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .emoji {
      font-size: 20px;
      line-height: 1;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #ffdf5d;
      margin: 0;
      line-height: 1.2;
    }
    .description {
      font-size: 13.5px;
      color: #8b949e;
      line-height: 1.5;
      margin: 12px 0 0 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge-container {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }
    .badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid;
      line-height: 1;
    }
    .badge-blue {
      background-color: #388bfd15;
      color: #58a6ff;
      border-color: #388bfd30;
    }
    .badge-brown {
      background-color: #9e6a0315;
      color: #e3b341;
      border-color: #9e6a0330;
    }
    .badge-purple {
      background-color: #8957e515;
      color: #bc8cff;
      border-color: #8957e530;
    }
  </style>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="card">
      <div>
        <div class="title-container">
          <span class="emoji">📄</span>
          <h3 class="title">Document Analysis &amp; RAG</h3>
        </div>
        <p class="description">OCR-powered expiration tracking + conversational RAG assistant with Mistral/Ollama.</p>
      </div>
      <div class="badge-container">
        <span class="badge badge-blue">OCR</span>
        <span class="badge badge-brown">LLM (Mistral)</span>
        <span class="badge badge-purple">RAG</span>
      </div>
    </div>
  </foreignObject>
</svg>
