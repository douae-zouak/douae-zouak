name: Generate Snake

on:
  schedule:
    # S'exécute toutes les 6 heures
    - cron: "0 */6 * * *"
  workflow_dispatch: # Permet de lancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v3

      # Génère le serpent (Version 3 stable pour le nouveau design GitHub)
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: douae-zouak
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      # Déploie les fichiers générés sur la branche "output"
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
